# =============================================================================
# Kirthi Diamonds — Cloud Build pipeline
# =============================================================================

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:latest
      - .

  - id: pre-validate
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        apk add --no-cache bash
        ./pre-deploy.sh
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080

  - id: validate
    name: node:22-alpine
    entrypoint: sh
    args: 
      - -c
      - |
        echo "Waiting 5 seconds for traffic to shift..."
        sleep 5
        node validate-deploy.cjs

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:latest

substitutions:
  _REGION: asia-southeast1
  _SERVICE: remix-remix-kirthi-diamonds
  _AR_REPO: web

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
