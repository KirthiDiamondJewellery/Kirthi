# =============================================================================
# Kirthi Diamonds — Cloud Build pipeline
# =============================================================================
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi"]

  # Deploy WITHOUT traffic, tagged so it gets its own preview URL
  - id: deploy-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --no-traffic \
          --tag=candidate

        # Extract the candidate URL and persist it for the next step
        gcloud run services describe ${_SERVICE} \
          --region=${_REGION} --format=json > /workspace/service.json

        python3 -c "
        import json
        d = json.load(open('/workspace/service.json'))
        url = next(t['url'] for t in d['status']['traffic'] if t.get('tag') == 'candidate')
        open('/workspace/candidate_url.txt','w').write(url)
        print('Candidate URL:', url)
        "

  # Validate the candidate BEFORE it receives traffic
  - id: validate
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        apk add --no-cache bash curl
        CANDIDATE_URL=$(cat /workspace/candidate_url.txt)
        echo "Validating $$CANDIDATE_URL"
        bash ./pre-deploy.sh "$$CANDIDATE_URL"

  # Only shift traffic if validation passed
  - id: promote
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - ${_SERVICE}
      - --region=${_REGION}
      - --to-latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:latest

substitutions:
  _REGION: asia-southeast1
  _SERVICE: remix-remix-kirthi-diamonds
  _AR_REPO: web

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
