# =============================================================================
# Kirthi Diamonds — Cloud Build pipeline
# =============================================================================
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi

  - id: deploy-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --no-traffic \
          --tag=candidate
        
        # Capture the candidate URL
        gcloud run services describe ${_SERVICE} --region=${_REGION} --format=json | grep -Eo 'https://candidate---[^"]*' | head -n 1 > /workspace/candidate_url.txt

  - id: validate-candidate
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        apk add --no-cache bash curl
        CANDIDATE_URL=$$(cat /workspace/candidate_url.txt)
        echo "Validating Candidate URL: $$CANDIDATE_URL"
        EXPECTED_HOST=https://kirthidiamonds.com STRICT=$${STRICT_MODE:-0} bash ./pre-deploy.sh "$$CANDIDATE_URL"

  - id: shift-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services update-traffic ${_SERVICE} --region=${_REGION} --to-latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/kirthi:latest
substitutions:
  _REGION: asia-southeast1
  _SERVICE: remix-remix-kirthi-diamonds
  _AR_REPO: web
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
